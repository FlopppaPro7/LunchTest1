name: Deploy RBXFlow web app to GitHub Pages

# Builds web/ and publishes the static site to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that, every push to the branch below redeploys.

on:
  push:
    branches: [claude/rbxflow-game-visualizer-lgqslo]
    paths:
      - "web/**"
      - "fixtures/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enables GitHub Pages (Source: GitHub Actions) automatically on the
      # first run, so no manual repo-settings toggle is required.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Keep the in-app sample in sync with the canonical fixture.
      - name: Sync sample fixture
        run: cp fixtures/sample-game.rbxflow.json web/public/sample-game.rbxflow.json

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
